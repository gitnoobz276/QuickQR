<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#0f172a,#1e293b);
        min-height:100vh;
        color:white;
        padding:40px;
    }

    h1{
        text-align:center;
        margin-bottom:30px;
        font-size:3rem;
    }

    .container{
        max-width:900px;
        margin:auto;
    }

    .card{
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        border-radius:25px;
        padding:30px;
        margin-bottom:30px;
        box-shadow:0 8px 25px rgba(0,0,0,0.3);
    }

    input{
        width:100%;
        padding:15px;
        border:none;
        outline:none;
        border-radius:15px;
        margin-top:10px;
        margin-bottom:20px;
        font-size:1rem;
    }

    button{
        background:#3b82f6;
        color:white;
        border:none;
        padding:15px 25px;
        border-radius:15px;
        cursor:pointer;
        font-size:1rem;
        transition:0.3s;
        margin-top:10px;
    }

    button:hover{
        background:#2563eb;
        transform:scale(1.05);
    }

    #qrcode{
        margin-top:25px;
        display:flex;
        justify-content:center;
    }

    .message{
        text-align:center;
        margin-top:20px;
        font-size:1.1rem;
        color:#93c5fd;
    }

    .creation-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
        margin-top:20px;
    }

    .creation-card{
        background:rgba(255,255,255,0.08);
        border-radius:20px;
        padding:20px;
        text-align:center;
        transition:0.3s;
    }

    .creation-card:hover{
        transform:translateY(-5px);
    }

    .creation-card img{
        width:150px;
        border-radius:10px;
        background:white;
        padding:10px;
    }

    .creation-name{
        margin-top:15px;
        font-size:1.2rem;
        font-weight:bold;
    }

    .hidden{
        display:none;
    }
</style>
</head>
<body>

<div class="container">

    <h1>QR Code Generator</h1>

    <div class="card">
        <h2>Enter Your Website URL</h2>

        <input 
            type="text" 
            id="urlInput" 
            placeholder="https://example.com"
        >

        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode"></div>

        <div id="afterGenerate" class="hidden">

            <p class="message">
                Screenshot your QR code so you can use it anywhere!
            </p>

            <input 
                type="text" 
                id="qrName" 
                placeholder="Enter QR Code Name"
            >

            <button onclick="saveQR()">Save QR Code</button>

        </div>
    </div>

    <div class="card">
        <h2>My Creations</h2>

        <div id="creations" class="creation-grid"></div>
    </div>

</div>

<script>

let currentQRImage = "";
let currentURL = "";

function generateQR(){

    const url = document.getElementById("urlInput").value;

    if(url.trim() === ""){
        alert("Please enter a URL!");
        return;
    }

    currentURL = url;

    const qrContainer = document.getElementById("qrcode");

    qrContainer.innerHTML = "";

    new QRCode(qrContainer,{
        text:url,
        width:220,
        height:220
    });

    setTimeout(() => {

        const img = qrContainer.querySelector("img");

        currentQRImage = img.src;

    },100);

    document.getElementById("afterGenerate").classList.remove("hidden");
}

function saveQR(){

    const name = document.getElementById("qrName").value;

    if(name.trim() === ""){
        alert("Please enter a QR code name!");
        return;
    }

    const creations = JSON.parse(localStorage.getItem("qrCreations")) || [];

    creations.push({
        name:name,
        image:currentQRImage,
        url:currentURL
    });

    localStorage.setItem("qrCreations",JSON.stringify(creations));

    loadCreations();

    document.getElementById("qrName").value = "";

    alert("QR Code Saved!");
}

function loadCreations(){

    const creationsDiv = document.getElementById("creations");

    creationsDiv.innerHTML = "";

    const creations = JSON.parse(localStorage.getItem("qrCreations")) || [];

    creations.forEach(item => {

        const card = document.createElement("div");

        card.className = "creation-card";

        card.innerHTML = `
            <img src="${item.image}">
            <div class="creation-name">${item.name}</div>
        `;

        creationsDiv.appendChild(card);

    });
}

loadCreations();

</script>

</body>
</html>
