<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickQR</title>

<link rel="icon" type="image/png" href="favicon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:1100px;
margin:auto;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-radius:25px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;
}

.logo{
font-size:2.3rem;
font-weight:bold;
}

.nav-links{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.nav-links button{
background:#3b82f6;
border:none;
padding:12px 18px;
border-radius:14px;
color:white;
cursor:pointer;
font-weight:bold;
}

.card{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:25px;
padding:30px;
margin-bottom:30px;
}

.hidden{
display:none !important;
}

#aiButton{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
background:#111827;
border:3px solid #3b82f6;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
z-index:9999;
}

#aiButton img{
width:100%;
height:100%;
object-fit:cover;
}

#aiChat{
position:fixed;
bottom:110px;
right:20px;
width:340px;
max-width:90%;
height:500px;
background:#0f172a;
border-radius:25px;
display:none;
flex-direction:column;
overflow:hidden;
z-index:9999;
border:1px solid rgba(255,255,255,0.15);
}

#aiHeader{
padding:18px;
background:#111827;
font-size:1.2rem;
font-weight:bold;
text-align:center;
}

#aiMessages{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.aiMsg{
padding:12px 15px;
border-radius:18px;
max-width:85%;
line-height:1.5;
font-size:0.95rem;
}

.user{
align-self:flex-end;
background:#3b82f6;
}

.bot{
align-self:flex-start;
background:#1e293b;
}

#aiInputArea{
display:flex;
padding:12px;
gap:10px;
background:#111827;
}

#aiInput{
flex:1;
padding:12px;
border:none;
border-radius:12px;
outline:none;
background:#1e293b;
color:white;
}

#sendBtn{
padding:12px 16px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.scanner-btn{
position:fixed;
right:20px;
bottom:100px;
width:65px;
height:65px;
border-radius:50%;
background:#3b82f6;
border:none;
cursor:pointer;
z-index:999;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.scanner-btn img{
width:35px;
}

#scannerOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
z-index:9999;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

#scannerVideo{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}

.scan-box{
position:relative;
width:260px;
height:260px;
border:3px solid #3b82f6;
border-radius:20px;
z-index:2;
}

.handle{
width:24px;
height:24px;
background:#3b82f6;
border:3px solid white;
border-radius:50%;
position:absolute;
}

.top-left{top:-12px;left:-12px;}
.top-right{top:-12px;right:-12px;}
.bottom-left{bottom:-12px;left:-12px;}
.bottom-right{bottom:-12px;right:-12px;}

.scan-line{
position:absolute;
left:0;
width:100%;
height:4px;
background:#3b82f6;
animation:scanMove 2s linear infinite;
}

@keyframes scanMove{
0%{top:0;}
100%{top:calc(100% - 4px);}
}

#closeScanner{
position:absolute;
top:20px;
right:20px;
z-index:5;
background:red;
}

.setting-group{
margin-top:30px;
}

.setting-title{
font-size:1.3rem;
margin-bottom:15px;
color:#93c5fd;
}

.setting-item{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:15px;
margin-bottom:15px;
gap:15px;
flex-wrap:wrap;
}

</style>
</head>

<body>

<div class="container">

<div class="navbar">

<div class="logo">QuickQR</div>

<div class="nav-links">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('faq')">FAQ</button>
<button onclick="showPage('tutorial')">Tutorial</button>
<button onclick="showPage('settings')">Settings</button>
</div>

</div>

<div id="homePage">

<div class="card">
<h1>Welcome to QuickQR</h1>
<p>Create and save QR codes easily.</p>
</div>

</div>

<div id="faqPage" class="hidden">

<div class="card">
<h1>FAQ</h1>
<p>QuickQR saves QR codes locally in your browser.</p>
</div>

</div>

<div id="tutorialPage" class="hidden">

<div class="card">
<h1>Tutorial</h1>

<iframe
width="100%"
height="500"
src="https://www.youtube.com/embed/C_dpYF1-GjU"
style="border:none;border-radius:20px;"
></iframe>

</div>

</div>

<div id="settingsPage" class="hidden">

<div class="card">

<h1>Settings</h1>

<div class="setting-group">

<div class="setting-title">
Appearance Settings
</div>

<div class="setting-item">
<span>Theme Mode</span>

<select onchange="changeTheme(this.value)">
<option value="dark">Dark</option>
<option value="light">Light</option>
</select>
</div>

<div class="setting-item">
<span>Accent Colour</span>

<select onchange="changeAccent(this.value)">
<option value="#3b82f6">Blue</option>
<option value="#22c55e">Green</option>
<option value="#ef4444">Red</option>
<option value="#a855f7">Purple</option>
</select>
</div>

</div>

</div>

</div>

</div>

<div id="aiButton">
<img src="ai.png">
</div>

<div id="aiChat">

<div id="aiHeader">
QuickQR Assistant
</div>

<div id="aiMessages">

<div class="aiMsg bot">
Hi! I can help you learn how to use QuickQR.
</div>

</div>

<div id="aiInputArea">
<input type="text" id="aiInput" placeholder="Ask something about QuickQR...">
<button id="sendBtn">Send</button>
</div>

</div>

<button class="scanner-btn" onclick="openScanner()">
<img src="scanner.png">
</button>

<div id="scannerOverlay">

<video id="scannerVideo" autoplay playsinline></video>

<button id="closeScanner" onclick="closeScanner()">
Close
</button>

<div class="scan-box" id="scanBox">

<div class="scan-line"></div>

<div class="handle top-left"></div>
<div class="handle top-right"></div>
<div class="handle bottom-left"></div>
<div class="handle bottom-right"></div>

</div>

</div>

<script>

function showPage(page){

document.getElementById("homePage").classList.add("hidden");
document.getElementById("faqPage").classList.add("hidden");
document.getElementById("tutorialPage").classList.add("hidden");
document.getElementById("settingsPage").classList.add("hidden");

if(page === "home"){
document.getElementById("homePage").classList.remove("hidden");
}

if(page === "faq"){
document.getElementById("faqPage").classList.remove("hidden");
}

if(page === "tutorial"){
document.getElementById("tutorialPage").classList.remove("hidden");
}

if(page === "settings"){
document.getElementById("settingsPage").classList.remove("hidden");
}

}

function changeTheme(mode){

if(mode === "light"){

document.body.style.background =
"linear-gradient(135deg,#e2e8f0,#cbd5e1)";

document.body.style.color = "black";

}else{

document.body.style.background =
"linear-gradient(135deg,#0f172a,#1e293b)";

document.body.style.color = "white";

}

}

function changeAccent(color){

document.querySelectorAll("button").forEach(btn=>{

btn.style.background = color;

});

}

const aiButton = document.getElementById("aiButton");
const aiChat = document.getElementById("aiChat");
const aiMessages = document.getElementById("aiMessages");
const aiInput = document.getElementById("aiInput");
const sendBtn = document.getElementById("sendBtn");

aiButton.onclick = () => {

if(aiChat.style.display === "flex"){
aiChat.style.display = "none";
}else{
aiChat.style.display = "flex";
}

};

function addMessage(text,type){

const div = document.createElement("div");

div.className = `aiMsg ${type}`;

div.innerText = text;

aiMessages.appendChild(div);

aiMessages.scrollTop = aiMessages.scrollHeight;

}

function generateQuickQRAnswer(question){

question = question.toLowerCase();

const quickqrKnowledge = [
"qr",
"quickqr",
"save",
"generate",
"download",
"share",
"tutorial",
"faq",
"colour",
"palette"
];

const related = quickqrKnowledge.some(word => question.includes(word));

if(!related){
return "Sorry! But I can't help you with unrelated questions.";
}

if(question.includes("share")){
return "To share your QR code, open My Creations and use the share buttons.";
}

if(question.includes("save")){
return "Your QR codes autosave inside your browser.";
}

if(question.includes("generate")){
return "Paste a URL and press Generate QR Code.";
}

return "I found information related to QuickQR.";

}

function handleAI(){

const text = aiInput.value.trim();

if(text === "") return;

addMessage(text,"user");

aiInput.value = "";

const thinking = document.createElement("div");

thinking.className = "aiMsg bot";
thinking.innerText = "Getting your answer...";

aiMessages.appendChild(thinking);

setTimeout(() => {

thinking.remove();

const answer = generateQuickQRAnswer(text);

addMessage(answer,"bot");

},1500);

}

sendBtn.onclick = handleAI;

aiInput.addEventListener("keypress",(e)=>{
if(e.key === "Enter"){
handleAI();
}
});

let scannerStream;

async function openScanner(){

const overlay = document.getElementById("scannerOverlay");

overlay.style.display = "flex";

try{

scannerStream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
}
});

document.getElementById("scannerVideo").srcObject = scannerStream;

}catch(err){

alert("Camera access denied.");

}

}

function closeScanner(){

document.getElementById("scannerOverlay").style.display = "none";

if(scannerStream){

scannerStream.getTracks().forEach(track => track.stop());

}

}

const scanBox = document.getElementById("scanBox");

let isDragging = false;
let currentHandle = null;

document.querySelectorAll(".handle").forEach(handle => {

handle.addEventListener("mousedown",(e)=>{

isDragging = true;
currentHandle = handle;

e.preventDefault();

});

});

document.addEventListener("mousemove",(e)=>{

if(!isDragging) return;

const rect = scanBox.getBoundingClientRect();

let width = rect.width;
let height = rect.height;

if(currentHandle.classList.contains("bottom-right")){

width = e.clientX - rect.left;
height = e.clientY - rect.top;

}

width = Math.max(width,150);
height = Math.max(height,150);

scanBox.style.width = width + "px";
scanBox.style.height = height + "px";

});

document.addEventListener("mouseup",()=>{

isDragging = false;

});

</script>

</body>
</html>
